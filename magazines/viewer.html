<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح المجلة | Mohamed Omar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Cairo', 'Tajawal', sans-serif;
            overflow-x: hidden;
        }
        
        .book-container {
            perspective: 2000px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .book {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 140%;
            transform-style: preserve-3d;
        }
        
        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.6s;
            transform-origin: left center;
            cursor: pointer;
            overflow: hidden;
        }
        
        .page-right {
            right: 0;
            transform-origin: left center;
        }
        
        .page-left {
            left: 0;
            transform-origin: right center;
            transform: rotateY(180deg);
        }
        
        .page.flipped-right {
            transform: rotateY(-180deg);
        }
        
        .page.flipped-left {
            transform: rotateY(0deg);
        }
        
        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .loading {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .nav-button {
            transition: all 0.3s;
        }
        
        .nav-button:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .page {
                width: 100%;
            }
            .page-left {
                display: none;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

    <!-- شاشة التحميل -->
    <div id="loading" class="loading">
        <div class="text-center">
            <div class="inline-block w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-cyan-400 text-xl font-bold">جاري تحميل المجلة...</p>
            <p id="loadingStatus" class="text-gray-400 text-sm mt-2">جاري قراءة قائمة الصفحات...</p>
        </div>
    </div>

    <!-- رسالة الخطأ -->
    <div id="errorMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90">
        <div class="bg-gray-900 border border-red-500/50 rounded-2xl p-8 max-w-md text-center">
            <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <h3 class="text-white text-xl font-bold mb-2">تعذر تحميل المجلة</h3>
            <p id="errorText" class="text-gray-400 mb-6">حدث خطأ</p>
            <button onclick="location.reload()" class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-3 rounded-xl font-bold transition-colors">
                إعادة المحاولة
            </button>
            <a href="../index.html#magazines-showcase" class="block mt-3 text-cyan-400 hover:text-cyan-300">
                العودة للموقع
            </a>
        </div>
    </div>

    <!-- شريط التحكم العلوي -->
    <div class="fixed top-0 left-0 right-0 bg-gray-900/90 backdrop-blur-md border-b border-cyan-500/30 z-40 px-6 py-3 flex items-center justify-between">
        <a href="../index.html#magazines-showcase" class="text-cyan-400 hover:text-cyan-300 flex items-center gap-2 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            <span class="hidden sm:inline">العودة للموقع</span>
        </a>
        
        <h1 id="magazineTitle" class="text-white font-bold text-lg truncate max-w-[200px]">تصفح المجلة</h1>
        
        <div class="flex items-center gap-2">
            <button onclick="prevPage()" class="nav-button text-cyan-400 hover:text-cyan-300 p-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
            
            <span id="pageIndicator" class="text-gray-300 text-sm font-mono bg-gray-800 px-3 py-1 rounded-full">1 / 1</span>
            
            <button onclick="nextPage()" class="nav-button text-cyan-400 hover:text-cyan-300 p-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- حاوية الكتاب -->
    <div class="mt-20 mb-8 w-full">
        <div id="book" class="book-container">
            <div id="bookInner" class="book"></div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900/90 backdrop-blur-md border-t border-cyan-500/30 z-40 px-6 py-3 flex items-center justify-center gap-4 flex-wrap">
        <input 
            type="range" 
            id="pageSlider" 
            min="0" 
            max="1" 
            value="0"
            class="w-48 sm:w-64 accent-cyan-400"
            oninput="goToPage(this.value)"
        >
        <button onclick="toggleFullscreen()" class="nav-button text-cyan-400 hover:text-cyan-300 p-2" title="ملء الشاشة">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
            </svg>
        </button>
    </div>

    <script>
        // قراءة اسم المجلة من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const magazineName = urlParams.get('magazine') || 'sun-kids';

        const MAGAZINE_CONFIG = {
            folder: `./${magazineName}/`,
            pages: [],
            title: magazineName
        };

        let currentPage = 0;
        let totalPages = 0;
        const bookInner = document.getElementById('bookInner');
        const loadingScreen = document.getElementById('loading');
        const loadingStatus = document.getElementById('loadingStatus');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        function showError(message) {
            loadingScreen.classList.add('hidden');
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        // قراءة ملف pages.txt
        async function loadPagesList() {
            loadingStatus.textContent = 'جاري قراءة قائمة الصفحات...';
            
            try {
                const response = await fetch(`${MAGAZINE_CONFIG.folder}pages.txt`);
                
                if (!response.ok) {
                    throw new Error('لم يتم العثور على ملف pages.txt');
                }
                
                const text = await response.text();
                const pages = text.split('\n')
                    .map(p => p.trim())
                    .filter(p => p !== '' && !p.startsWith('#'));
                
                if (pages.length === 0) {
                    throw new Error('ملف pages.txt فارغ');
                }
                
                MAGAZINE_CONFIG.pages = pages;
                totalPages = pages.length;
                loadingStatus.textContent = `تم العثور على ${pages.length} صفحة. جاري التحميل...`;
                
                return true;
            } catch (error) {
                console.error('Error:', error);
                showError(`تعذر قراءة قائمة الصفحات: ${error.message}`);
                return false;
            }
        }

        // إنشاء الصفحات
        async function createPages() {
            loadingStatus.textContent = 'جاري تحميل الصور...';
            bookInner.innerHTML = '';
            
            const loadPromises = MAGAZINE_CONFIG.pages.map((page, index) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    const fullPath = `${MAGAZINE_CONFIG.folder}${page}`;
                    
                    img.onload = () => {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page page-right';
                        pageDiv.style.zIndex = totalPages - index;
                        pageDiv.innerHTML = `<img src="${fullPath}" alt="صفحة ${index + 1}" loading="lazy">`;
                        pageDiv.onclick = () => nextPage();
                        bookInner.appendChild(pageDiv);
                        resolve();
                    };
                    
                    img.onerror = () => {
                        console.warn(`فشل تحميل: ${fullPath}`);
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page page-right bg-gray-200 flex items-center justify-center';
                        pageDiv.style.zIndex = totalPages - index;
                        pageDiv.innerHTML = `<p class="text-gray-500 text-center p-4">صفحة ${index + 1}</p>`;
                        bookInner.appendChild(pageDiv);
                        resolve();
                    };
                    
                    img.src = fullPath;
                });
            });
            
            await Promise.all(loadPromises);
            updateDisplay();
            loadingScreen.classList.add('hidden');
        }

        function updateDisplay() {
            const pages = document.querySelectorAll('.page');
            pages.forEach((page, index) => {
                if (index < currentPage) {
                    page.classList.add('flipped-right');
                    page.classList.remove('page-right');
                    page.classList.add('page-left');
                } else {
                    page.classList.remove('flipped-right');
                    page.classList.remove('page-left');
                    page.classList.add('page-right');
                }
            });
            
            document.getElementById('pageIndicator').textContent = `${currentPage + 1} / ${totalPages}`;
            document.getElementById('pageSlider').max = totalPages - 1;
            document.getElementById('pageSlider').value = currentPage;
        }

        function nextPage() {
            if (currentPage < totalPages - 1) {
                currentPage++;
                updateDisplay();
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                updateDisplay();
            }
        }

        function goToPage(pageNumber) {
            currentPage = parseInt(pageNumber);
            updateDisplay();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // اختصارات لوحة المفاتيح
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // التمرير باللمس/الماوس
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    nextPage();
                } else {
                    prevPage();
                }
            }
        });

        // التشغيل
        document.getElementById('magazineTitle').textContent = MAGAZINE_CONFIG.title;

        (async function init() {
            const pagesLoaded = await loadPagesList();
            if (pagesLoaded) {
                await createPages();
            }
        })();
    </script>
</body>
</html>
