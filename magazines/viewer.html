<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح المجلة | Mohamed Omar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        * { box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* حاوية الكتاب */
        .book-wrapper {
            perspective: 3000px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-top: 80px;
            margin-bottom: 100px;
        }
        
        .book {
            position: relative;
            width: 800px;
            height: 560px;
            max-width: 95vw;
            max-height: 70vh;
            transform-style: preserve-3d;
        }
        
        @media (max-width: 768px) {
            .book {
                width: 320px;
                height: 450px;
            }
        }
        
        /* كل زوج صفحات (spread) */
        .spread {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            transform-origin: left center;
        }
        
        .spread.flipped {
            transform: rotateY(-180deg);
        }
        
        /* وجه الصفحات */
        .spread-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            overflow: hidden;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .spread-face.front {
            z-index: 2;
        }
        
        .spread-face.back {
            transform: rotateY(180deg);
            z-index: 1;
        }
        
        .page-img {
            flex: 1;
            height: 100%;
            object-fit: cover;
        }
        
        .page-img.left {
            border-left: 2px solid #333;
        }
        
        .page-img.right {
            border-right: 2px solid #333;
        }
        
        /* ثنية الكتاب */
        .book-spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to right, #1a1a1a, #333, #1a1a1a);
            transform: translateX(-50%);
            z-index: 100;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        @media (max-width: 768px) {
            .book-spine { display: none; }
            .page-img.left { display: none; }
        }
        
        /* شاشة التحميل */
        .loading {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* الأزرار */
        .nav-btn {
            transition: all 0.3s;
            background: rgba(6, 182, 212, 0.1);
            border: 2px solid rgba(6, 182, 212, 0.3);
        }
        
        .nav-btn:hover:not(:disabled) {
            background: rgba(6, 182, 212, 0.3);
            transform: scale(1.1);
        }
        
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loading" class="loading">
        <div class="text-center">
            <div class="inline-block w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-cyan-400 text-2xl font-bold">جاري تحميل المجلة...</p>
            <p id="loadingStatus" class="text-gray-400 text-sm mt-2">جاري قراءة قائمة الصفحات...</p>
        </div>
    </div>

    <!-- رسالة الخطأ -->
    <div id="errorMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90">
        <div class="error-box rounded-2xl p-8 max-w-md text-center">
            <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <h3 class="text-white text-xl font-bold mb-2">تعذر تحميل المجلة</h3>
            <p id="errorText" class="text-gray-400 mb-6">حدث خطأ</p>
            <button onclick="location.reload()" class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-3 rounded-xl font-bold transition-colors mb-3">
                إعادة المحاولة
            </button>
            <br>
            <a href="../index.html#all-magazines-sec" class="text-cyan-400 hover:text-cyan-300">
                العودة للموقع
            </a>
        </div>
    </div>

    <!-- شريط التحكم العلوي -->
    <div class="fixed top-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-b border-cyan-500/30 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="../index.html#all-magazines-sec" class="text-cyan-400 hover:text-cyan-300 flex items-center gap-2 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                <span class="hidden sm:inline font-bold">العودة للموقع</span>
            </a>
            
            <h1 id="magazineTitle" class="text-white font-bold text-lg md:text-xl">تصفح المجلة</h1>
            
            <div class="flex items-center gap-3">
                <button onclick="prevPage()" id="prevBtn" class="nav-btn text-cyan-400 p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                
                <span id="pageIndicator" class="text-gray-300 text-sm font-mono bg-gray-800 px-4 py-2 rounded-full">
                    1 / 1
                </span>
                
                <button onclick="nextPage()" id="nextBtn" class="nav-btn text-cyan-400 p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- حاوية الكتاب -->
    <div class="book-wrapper">
        <div class="book" id="book">
            <div class="book-spine"></div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-t border-cyan-500/30 z-40 px-6 py-4">
        <div class="max-w-3xl mx-auto flex items-center justify-center gap-4">
            <input 
                type="range" 
                id="pageSlider" 
                min="0" 
                max="1" 
                value="0"
                class="w-48 sm:w-64 accent-cyan-400"
                oninput="goToPage(this.value)"
            >
            <button onclick="toggleFullscreen()" class="nav-btn text-cyan-400 p-2 rounded-lg" title="ملء الشاشة">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // قراءة اسم المجلة من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const magazineName = urlParams.get('magazine') || 'sun-kids';

        const MAGAZINE_CONFIG = {
            folder: `./${magazineName}/`,
            pages: [],
            title: magazineName
        };

        let currentSpread = 0;
        let totalSpreads = 0;
        const bookElement = document.getElementById('book');
        const loadingScreen = document.getElementById('loading');
        const loadingStatus = document.getElementById('loadingStatus');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // صوت تقليب الصفحات (Base64 مدمج - لا يحتاج تحميل خارجي)
        const flipSound = new Audio("data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIGGS57OihUBELTKXh8bllHAU2j9Xvz3kpBSh+zPDajzsKFWC06OyrWBUIQ5zd8sFuJAUuhM/z24k2CBhku+zooVARC0yl4fG5ZRwFNo/V7895KQUofsz");
        
        function playFlipSound() {
            flipSound.currentTime = 0;
            flipSound.play().catch(e => console.log('Sound error:', e));
        }

        function showError(message) {
            loadingScreen.classList.add('hidden');
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            console.error('Error:', message);
        }

        // قراءة ملف pages.txt
        async function loadPagesList() {
            loadingStatus.textContent = 'جاري قراءة قائمة الصفحات...';
            
            try {
                const response = await fetch(`${MAGAZINE_CONFIG.folder}pages.txt`);
                if (!response.ok) throw new Error('لم يتم العثور على ملف pages.txt');
                
                const text = await response.text();
                const pages = text.split('\n')
                    .map(p => p.trim())
                    .filter(p => p !== '' && !p.startsWith('#'));
                
                if (pages.length === 0) throw new Error('ملف pages.txt فارغ');
                
                MAGAZINE_CONFIG.pages = pages;
                totalSpreads = Math.ceil(pages.length / 2);
                loadingStatus.textContent = `تم العثور على ${pages.length} صفحة. جاري التحميل...`;
                return true;
            } catch (error) {
                showError(`تعذر قراءة قائمة الصفحات: ${error.message}`);
                return false;
            }
        }

        // إنشاء أزواج الصفحات (Spreads)
        async function createSpreads() {
            loadingStatus.textContent = 'جاري تحميل الصور...';
            
            // إزالة الأزواج القديمة (احتفظ بالـ spine)
            const spine = bookElement.querySelector('.book-spine');
            bookElement.innerHTML = '';
            bookElement.appendChild(spine);
            
            // تحميل جميع الصور أولاً
            const imagePromises = MAGAZINE_CONFIG.pages.map((page) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    const fullPath = `${MAGAZINE_CONFIG.folder}${page}`;
                    img.onload = () => resolve(fullPath);
                    img.onerror = () => resolve(null);
                    img.src = fullPath;
                });
            });
            
            const loadedImages = await Promise.all(imagePromises);
            
            // إنشاء أزواج الصفحات
            for (let i = 0; i < totalSpreads; i++) {
                const leftIndex = i * 2;
                const rightIndex = i * 2 + 1;
                
                const spread = document.createElement('div');
                spread.className = 'spread';
                spread.dataset.spreadIndex = i;
                
                // z-index: الأزواج الأولى في الأعلى
                spread.style.zIndex = totalSpreads - i;
                
                const leftImg = loadedImages[leftIndex] || '';
                const rightImg = loadedImages[rightIndex] || '';
                
                // الوجه الأمامي (الصفحة اليسرى + اليمنى)
                const frontFace = document.createElement('div');
                frontFace.className = 'spread-face front';
                frontFace.innerHTML = `
                    ${leftImg ? `<img src="${leftImg}" class="page-img left" alt="صفحة ${leftIndex + 1}">` : '<div class="page-img left bg-gray-200 flex items-center justify-center text-gray-500">صفحة ' + (leftIndex + 1) + '</div>'}
                    ${rightImg ? `<img src="${rightImg}" class="page-img right" alt="صفحة ${rightIndex + 1}">` : '<div class="page-img right bg-gray-200 flex items-center justify-center text-gray-500">صفحة ' + (rightIndex + 1) + '</div>'}
                `;
                
                // الوجه الخلفي (نفس الصفحات لكن مقلوبة)
                const backFace = document.createElement('div');
                backFace.className = 'spread-face back';
                backFace.innerHTML = frontFace.innerHTML;
                
                spread.appendChild(frontFace);
                spread.appendChild(backFace);
                
                // النقر للتقليب
                spread.onclick = (e) => {
                    const rect = spread.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    
                    if (clickX < rect.width / 2) {
                        // نقر على اليسار = رجوع
                        prevPage();
                    } else {
                        // نقر على اليمين = تقدم
                        nextPage();
                    }
                };
                
                bookElement.appendChild(spread);
            }
            
            loadingStatus.textContent = 'جاهز!';
            updateBookView();
        }

        function updateBookView() {
            const isMobile = window.innerWidth <= 768;
            const spreads = bookElement.querySelectorAll('.spread');
            
            spreads.forEach((spread, index) => {
                if (isMobile) {
                    // في الجوال: نعرض spread واحد فقط
                    if (index === currentSpread) {
                        spread.style.display = 'block';
                        spread.classList.remove('flipped');
                    } else {
                        spread.style.display = 'none';
                    }
                } else {
                    // في الكمبيوتر: كل الأزواج مرئية
                    spread.style.display = 'block';
                    if (index < currentSpread) {
                        spread.classList.add('flipped');
                    } else {
                        spread.classList.remove('flipped');
                    }
                }
            });
            
            // تحديث العداد
            const currentPageNum = currentSpread * 2 + 1;
            const endPageNum = Math.min(currentSpread * 2 + 2, MAGAZINE_CONFIG.pages.length);
            
            document.getElementById('pageIndicator').textContent = 
                isMobile ? `${currentPageNum} / ${MAGAZINE_CONFIG.pages.length}` : 
                `${currentPageNum}-${endPageNum} / ${MAGAZINE_CONFIG.pages.length}`;
            
            document.getElementById('pageSlider').max = totalSpreads - 1;
            document.getElementById('pageSlider').value = currentSpread;
            
            // تحديث حالة الأزرار
            document.getElementById('prevBtn').disabled = currentSpread === 0;
            document.getElementById('nextBtn').disabled = currentSpread >= totalSpreads - 1;
        }

        function nextPage() {
            if (currentSpread < totalSpreads - 1) {
                currentSpread++;
                playFlipSound();
                updateBookView();
            }
        }

        function prevPage() {
            if (currentSpread > 0) {
                currentSpread--;
                playFlipSound();
                updateBookView();
            }
        }

        function goToPage(pageNumber) {
            currentSpread = parseInt(pageNumber);
            playFlipSound();
            updateBookView();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // اختصارات لوحة المفاتيح
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') nextPage();
            if (e.key === 'ArrowRight') prevPage();
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // السحب باللمس
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });
        document.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextPage();
                else prevPage();
            }
        });

        // إعادة التحديث عند تغيير حجم الشاشة
        window.addEventListener('resize', updateBookView);

        // التشغيل
        document.getElementById('magazineTitle').textContent = MAGAZINE_CONFIG.title;

        (async function init() {
            const pagesLoaded = await loadPagesList();
            if (pagesLoaded) {
                await createSpreads();
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 300);
            }
        })();
    </script>
</body>
</html>
