<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح المجلة | Mohamed Omar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        * { box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        
        .book-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-top: 80px;
            margin-bottom: 100px;
        }
        
        .book {
            position: relative;
            width: 800px;
            height: 560px;
            max-width: 95vw;
            max-height: 70vh;
            background: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        
        @media (max-width: 768px) {
            .book {
                width: 320px;
                height: 450px;
            }
        }
        
        /* حاوية الصفحتين المتقابلتين */
        .spread-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
        }
        
        .page-display {
            flex: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        
        .page-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .page-display.left {
            border-right: 2px solid #333;
        }
        
        .page-display.right {
            border-left: 2px solid #333;
        }
        
        /* تأثير الانتقال */
        .page-display {
            transition: opacity 0.3s ease;
        }
        
        .page-display.changing {
            opacity: 0;
        }
        
        /* ثنية الكتاب */
        .book-spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to right, #1a1a1a, #333, #1a1a1a);
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        @media (max-width: 768px) {
            .book-spine { display: none; }
            .page-display.left { display: none; }
        }
        
        .loading {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .nav-btn {
            transition: all 0.3s;
            background: rgba(6, 182, 212, 0.1);
            border: 2px solid rgba(6, 182, 212, 0.3);
        }
        
        .nav-btn:hover:not(:disabled) {
            background: rgba(6, 182, 212, 0.3);
            transform: scale(1.1);
        }
        
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">
        <div class="text-center">
            <div class="inline-block w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-cyan-400 text-2xl font-bold">جاري تحميل المجلة...</p>
            <p id="loadingStatus" class="text-gray-400 text-sm mt-2">جاري قراءة قائمة الصفحات...</p>
        </div>
    </div>

    <div id="errorMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90">
        <div class="error-box rounded-2xl p-8 max-w-md text-center">
            <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <h3 class="text-white text-xl font-bold mb-2">تعذر تحميل المجلة</h3>
            <p id="errorText" class="text-gray-400 mb-6">حدث خطأ</p>
            <button onclick="location.reload()" class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-3 rounded-xl font-bold transition-colors mb-3">
                إعادة المحاولة
            </button>
            <br>
            <a href="../index.html#all-magazines-sec" class="text-cyan-400 hover:text-cyan-300">
                العودة للموقع
            </a>
        </div>
    </div>

    <div class="fixed top-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-b border-cyan-500/30 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="../index.html#all-magazines-sec" class="text-cyan-400 hover:text-cyan-300 flex items-center gap-2 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                <span class="hidden sm:inline font-bold">العودة للموقع</span>
            </a>
            
            <h1 id="magazineTitle" class="text-white font-bold text-lg md:text-xl">تصفح المجلة</h1>
            
            <div class="flex items-center gap-3">
                <button onclick="prevPage()" id="prevBtn" class="nav-btn text-cyan-400 p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                
                <span id="pageIndicator" class="text-gray-300 text-sm font-mono bg-gray-800 px-4 py-2 rounded-full">
                    1 / 1
                </span>
                
                <button onclick="nextPage()" id="nextBtn" class="nav-btn text-cyan-400 p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="book-wrapper">
        <div class="book" id="book">
            <div class="book-spine"></div>
            <div class="spread-container">
                <div class="page-display left" id="leftPage">
                    <img src="" alt="الصفحة اليسرى">
                </div>
                <div class="page-display right" id="rightPage">
                    <img src="" alt="الصفحة اليمنى">
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-t border-cyan-500/30 z-40 px-6 py-4">
        <div class="max-w-3xl mx-auto flex items-center justify-center gap-4">
            <input 
                type="range" 
                id="pageSlider" 
                min="0" 
                max="1" 
                value="0"
                class="w-48 sm:w-64 accent-cyan-400"
                oninput="goToPage(this.value)"
            >
            <button onclick="toggleFullscreen()" class="nav-btn text-cyan-400 p-2 rounded-lg" title="ملء الشاشة">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const magazineName = urlParams.get('magazine') || 'sun-kids';

        const MAGAZINE_CONFIG = {
            folder: `./${magazineName}/`,
            pages: [],
            title: magazineName
        };

        let currentPageIndex = 0;
        let totalPages = 0;
        const pageImages = [];
        
        const loadingScreen = document.getElementById('loading');
        const loadingStatus = document.getElementById('loadingStatus');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const leftPageImg = document.querySelector('#leftPage img');
        const rightPageImg = document.querySelector('#rightPage img');
        const leftPageDiv = document.getElementById('leftPage');
        const rightPageDiv = document.getElementById('rightPage');

        // صوت تقليب ورق حقيقي من CDN موثوق
        const flipSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2398/2398-preview.mp3');
        flipSound.volume = 0.6;
        flipSound.preload = 'auto';
        
        function playFlipSound() {
            flipSound.currentTime = 0;
            flipSound.play().catch(e => {
                console.log('Sound error:', e);
                // محاولة بديلة
                const audio2 = new Audio('https://cdn.jsdelivr.net/gh/nicehash/nicehash-desktop@master/resources/sounds/page-flip.mp3');
                audio2.volume = 0.6;
                audio2.play().catch(e2 => console.log('Backup sound error:', e2));
            });
        }

        function showError(message) {
            loadingScreen.classList.add('hidden');
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            console.error('Error:', message);
        }

        async function loadPagesList() {
            loadingStatus.textContent = 'جاري قراءة قائمة الصفحات...';
            
            try {
                const response = await fetch(`${MAGAZINE_CONFIG.folder}pages.txt`);
                if (!response.ok) throw new Error('لم يتم العثور على ملف pages.txt');
                
                const text = await response.text();
                const pages = text.split('\n')
                    .map(p => p.trim())
                    .filter(p => p !== '' && !p.startsWith('#'));
                
                if (pages.length === 0) throw new Error('ملف pages.txt فارغ');
                
                MAGAZINE_CONFIG.pages = pages;
                totalPages = pages.length;
                loadingStatus.textContent = `تم العثور على ${pages.length} صفحة. جاري التحميل...`;
                return true;
            } catch (error) {
                showError(`تعذر قراءة قائمة الصفحات: ${error.message}`);
                return false;
            }
        }

        async function loadAllImages() {
            loadingStatus.textContent = 'جاري تحميل الصور...';
            
            const promises = MAGAZINE_CONFIG.pages.map((page) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    const fullPath = `${MAGAZINE_CONFIG.folder}${page}`;
                    img.onload = () => {
                        pageImages.push(fullPath);
                        resolve();
                    };
                    img.onerror = () => {
                        pageImages.push(null);
                        resolve();
                    };
                    img.src = fullPath;
                });
            });
            
            await Promise.all(promises);
        }

        function updateBookView() {
            const isMobile = window.innerWidth <= 768;
            
            // تأثير الانتقال
            leftPageDiv.classList.add('changing');
            rightPageDiv.classList.add('changing');
            
            setTimeout(() => {
                // الصفحة اليسرى
                if (isMobile) {
                    leftPageDiv.style.display = 'none';
                } else {
                    leftPageDiv.style.display = 'block';
                    const leftSrc = pageImages[currentPageIndex] || '';
                    leftPageImg.src = leftSrc;
                    leftPageImg.alt = `صفحة ${currentPageIndex + 1}`;
                }
                
                // الصفحة اليمنى
                const rightIndex = currentPageIndex + 1;
                const rightSrc = pageImages[rightIndex] || '';
                rightPageImg.src = rightSrc;
                rightPageImg.alt = `صفحة ${rightIndex + 1}`;
                
                // إزالة تأثير الانتقال
                setTimeout(() => {
                    leftPageDiv.classList.remove('changing');
                    rightPageDiv.classList.remove('changing');
                }, 50);
            }, 300);
            
            // تحديث العداد
            const displayStart = currentPageIndex + 1;
            const displayEnd = Math.min(currentPageIndex + 2, totalPages);
            
            document.getElementById('pageIndicator').textContent = 
                isMobile ? `${displayStart} / ${totalPages}` : 
                `${displayStart}-${displayEnd} / ${totalPages}`;
            
            document.getElementById('pageSlider').max = totalPages - 1;
            document.getElementById('pageSlider').value = currentPageIndex;
            
            // تحديث حالة الأزرار
            document.getElementById('prevBtn').disabled = currentPageIndex === 0;
            document.getElementById('nextBtn').disabled = currentPageIndex >= totalPages - 2;
        }

        function nextPage() {
            if (currentPageIndex + 1 < totalPages) {
                currentPageIndex += 2; // ننتقل صفحتين (زوج كامل)
                if (currentPageIndex >= totalPages) {
                    currentPageIndex = totalPages - 1;
                }
                playFlipSound();
                updateBookView();
            }
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex -= 2; // نرجع صفحتين
                if (currentPageIndex < 0) {
                    currentPageIndex = 0;
                }
                playFlipSound();
                updateBookView();
            }
        }

        function goToPage(pageNumber) {
            currentPageIndex = parseInt(pageNumber);
            // التأكد من أن الرقم زوجي (لأننا نعرض صفحتين معاً)
            if (currentPageIndex % 2 !== 0) {
                currentPageIndex--;
            }
            playFlipSound();
            updateBookView();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') nextPage();
            if (e.key === 'ArrowRight') prevPage();
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });
        document.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextPage();
                else prevPage();
            }
        });

        // النقر على الصفحات
        leftPageDiv.onclick = prevPage;
        rightPageDiv.onclick = nextPage;

        window.addEventListener('resize', updateBookView);

        document.getElementById('magazineTitle').textContent = MAGAZINE_CONFIG.title;

        (async function init() {
            const pagesLoaded = await loadPagesList();
            if (pagesLoaded) {
                await loadAllImages();
                updateBookView();
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 300);
            }
        })();
    </script>
</body>
</html>
