<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفح المجلة | Mohamed Omar</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- مكتبة StPageFlip للتقليب الواقعي -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
        }
        
        /* حاوية الكتاب */
        .book-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-top: 80px;
            margin-bottom: 100px;
        }
        
        /* الصفحات */
        .page {
            background-color: white;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* شاشة التحميل */
        .loading {
            position: fixed;
            inset: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }
        
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        /* أزرار التنقل */
        .nav-btn {
            transition: all 0.3s;
            background: rgba(6, 182, 212, 0.1);
            border: 2px solid rgba(6, 182, 212, 0.3);
        }
        
        .nav-btn:hover:not(:disabled) {
            background: rgba(6, 182, 212, 0.3);
            transform: scale(1.1);
        }
        
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* رسالة الخطأ */
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loading" class="loading">
        <div class="text-center">
            <div class="inline-block w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-cyan-400 text-2xl font-bold">جاري تحميل المجلة...</p>
            <p id="loadingStatus" class="text-gray-400 text-sm mt-2">جاري قراءة قائمة الصفحات...</p>
        </div>
    </div>

    <!-- رسالة الخطأ -->
    <div id="errorMessage" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90">
        <div class="error-box rounded-2xl p-8 max-w-md text-center">
            <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <h3 class="text-white text-xl font-bold mb-2">تعذر تحميل المجلة</h3>
            <p id="errorText" class="text-gray-400 mb-6">حدث خطأ</p>
            <button onclick="location.reload()" class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-3 rounded-xl font-bold transition-colors mb-3">
                إعادة المحاولة
            </button>
            <br>
            <a href="../index.html#all-magazines-sec" class="text-cyan-400 hover:text-cyan-300">
                العودة للموقع
            </a>
        </div>
    </div>

    <!-- شريط التحكم العلوي -->
    <div class="fixed top-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-b border-cyan-500/30 z-40 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="../index.html#all-magazines-sec" class="text-cyan-400 hover:text-cyan-300 flex items-center gap-2 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                <span class="hidden sm:inline font-bold">العودة للموقع</span>
            </a>
            
            <h1 id="magazineTitle" class="text-white font-bold text-lg md:text-xl">تصفح المجلة</h1>
            
            <div class="flex items-center gap-3">
                <button onclick="prevPage()" id="prevBtn" class="nav-btn text-cyan-400 p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                
                <span id="pageIndicator" class="text-gray-300 text-sm font-mono bg-gray-800 px-4 py-2 rounded-full">
                    1 / 1
                </span>
                
                <button onclick="nextPage()" id="nextBtn" class="nav-btn text-cyan-400 p-2 rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- حاوية الكتاب -->
    <div class="book-container">
        <div id="book"></div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-t border-cyan-500/30 z-40 px-6 py-4">
        <div class="max-w-3xl mx-auto flex items-center justify-center gap-4">
            <input 
                type="range" 
                id="pageSlider" 
                min="0" 
                max="1" 
                value="0"
                class="w-48 sm:w-64 accent-cyan-400"
                oninput="goToPage(this.value)"
            >
            <button onclick="toggleFullscreen()" class="nav-btn text-cyan-400 p-2 rounded-lg" title="ملء الشاشة">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // قراءة اسم المجلة من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const magazineName = urlParams.get('magazine') || 'sun-kids';

        const MAGAZINE_CONFIG = {
            folder: `./${magazineName}/`,
            pages: [],
            title: magazineName
        };

        let pageFlip;
        const bookElement = document.getElementById('book');
        const loadingScreen = document.getElementById('loading');
        const loadingStatus = document.getElementById('loadingStatus');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        function showError(message) {
            loadingScreen.classList.add('hidden');
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            console.error('Error:', message);
        }

        // قراءة ملف pages.txt
        async function loadPagesList() {
            loadingStatus.textContent = 'جاري قراءة قائمة الصفحات...';
            
            try {
                const response = await fetch(`${MAGAZINE_CONFIG.folder}pages.txt`);
                if (!response.ok) throw new Error('لم يتم العثور على ملف pages.txt');
                
                const text = await response.text();
                const pages = text.split('\n')
                    .map(p => p.trim())
                    .filter(p => p !== '' && !p.startsWith('#'));
                
                if (pages.length === 0) throw new Error('ملف pages.txt فارغ');
                
                MAGAZINE_CONFIG.pages = pages;
                loadingStatus.textContent = `تم العثور على ${pages.length} صفحة. جاري التحميل...`;
                return true;
            } catch (error) {
                showError(`تعذر قراءة قائمة الصفحات: ${error.message}`);
                return false;
            }
        }

        // إنشاء الصفحات
        async function createPages() {
            loadingStatus.textContent = 'جاري تحميل الصور...';
            bookElement.innerHTML = '';
            
            const loadPromises = MAGAZINE_CONFIG.pages.map((page, index) => {
                return new Promise((resolve) => {
                    const img = new Image();
                    const fullPath = `${MAGAZINE_CONFIG.folder}${page}`;
                    
                    img.onload = () => {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page';
                        pageDiv.innerHTML = `<img src="${fullPath}" alt="صفحة ${index + 1}">`;
                        bookElement.appendChild(pageDiv);
                        resolve();
                    };
                    
                    img.onerror = () => {
                        console.warn(`فشل تحميل: ${fullPath}`);
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page bg-gray-200 flex items-center justify-center';
                        pageDiv.innerHTML = `<p class="text-gray-500 text-center p-4">صفحة ${index + 1}</p>`;
                        bookElement.appendChild(pageDiv);
                        resolve();
                    };
                    
                    img.src = fullPath;
                });
            });
            
            await Promise.all(loadPromises);
            loadingStatus.textContent = 'جاري تهيئة عارض الصفحات...';
        }

        // تهيئة مكتبة StPageFlip
        function initFlipBook() {
            if (typeof StPageFlip === 'undefined') {
                showError('مكتبة تقليب الصفحات لم تُحمّل. تحقق من اتصالك بالإنترنت.');
                return;
            }

            try {
                // تحديد حجم الكتاب حسب الشاشة
                const isMobile = window.innerWidth <= 768;
                const pageWidth = isMobile ? 300 : 400;
                const pageHeight = isMobile ? 420 : 550;

                pageFlip = new StPageFlip.PageFlip(bookElement, {
                    width: pageWidth,
                    height: pageHeight,
                    size: 'stretch',
                    minWidth: 250,
                    maxWidth: 500,
                    minHeight: 350,
                    maxHeight: 700,
                    showCover: true,
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: true,
                    flippingTime: 1000,
                    usePortrait: isMobile,
                    startPage: 0,
                    autoSize: true,
                    drawShadow: true,
                    useMouseEvents: true,
                    swipeDistance: 30,
                    showPageCorners: true,
                    disableFlipByClick: false,
                    startZIndex: 0
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                // تحديث العداد عند تقليب الصفحة
                pageFlip.on('flip', (e) => {
                    updatePageIndicator(e.data);
                });

                // إخفاء شاشة التحميل
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                }, 500);
                
            } catch (error) {
                console.error('Error initializing PageFlip:', error);
                showError(`خطأ في تهيئة عارض الصفحات: ${error.message}`);
            }
        }

        function updatePageIndicator(currentPage) {
            const totalPages = pageFlip ? pageFlip.getPageCount() : MAGAZINE_CONFIG.pages.length;
            document.getElementById('pageIndicator').textContent = `${currentPage + 1} / ${totalPages}`;
            document.getElementById('pageSlider').max = totalPages - 1;
            document.getElementById('pageSlider').value = currentPage;
            
            // تحديث حالة الأزرار
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages - 1;
        }

        function nextPage() {
            if (pageFlip) pageFlip.flipNext();
        }

        function prevPage() {
            if (pageFlip) pageFlip.flipPrev();
        }

        function goToPage(pageNumber) {
            if (pageFlip) pageFlip.flip(parseInt(pageNumber));
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // اختصارات لوحة المفاتيح
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') nextPage();
            if (e.key === 'ArrowRight') prevPage();
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // إعادة التهيئة عند تغيير حجم الشاشة
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (pageFlip) {
                    pageFlip.destroy();
                    initFlipBook();
                }
            }, 250);
        });

        // التشغيل
        document.getElementById('magazineTitle').textContent = MAGAZINE_CONFIG.title;

        (async function init() {
            const pagesLoaded = await loadPagesList();
            if (pagesLoaded) {
                await createPages();
                initFlipBook();
            }
        })();
    </script>
</body>
</html>
